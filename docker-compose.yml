services:
  nutrient-deficiency-chatbot-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      # Copy your GROQ_API_KEY from .env or export it in your shell before running
      - GROQ_API_KEY=${GROQ_API_KEY}
    ports:
      - "8005:8005"
    restart: unless-stopped
    # Not exposed to host – only reachable from the frontend container via 'backend:8005'

  nutrient-deficiency-chatbot-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "5000:5000"
    depends_on:
      - nutrient-deficiency-chatbot-backend
    restart: unless-stopped
