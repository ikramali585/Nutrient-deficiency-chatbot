server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Increase timeout to match the frontend's 60-second API timeout
    proxy_read_timeout 70;
    proxy_connect_timeout 70;
    proxy_send_timeout 70;

    # Proxy YOLO + LLM analysis endpoint
    location /analyze {
        proxy_pass         http://backend:8000/analyze;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 20M;
    }

    # Proxy chat endpoint
    location /chat {
        proxy_pass         http://backend:8000/chat;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # React SPA – fall back to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
